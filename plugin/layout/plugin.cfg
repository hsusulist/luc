name=layout
author=hsusulist
desc=Explorer bar and terminal panel layout defaults
enabled=1
locked=0

# Explorer bar: tree on the left, 28 columns including its divider.
# Supported content: tree.
explorer=1
explorer.title=EXPLORER
explorer.side=left
explorer.width=28
explorer.content=tree

# Terminal panel: title + two output rows + command input.
# Supported content: terminal.
terminal=1
terminal.title=TERMINAL
terminal.height=4
terminal.content=terminal

# User overrides in %APPDATA%\LUC\lcode.cfg win over these defaults.
