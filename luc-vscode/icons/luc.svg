<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img">
  <title>LUC logo</title>
  <defs>
    <linearGradient id="forge" x1="20" y1="20" x2="90" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc65c"/>
      <stop offset=".52" stop-color="#ff963e"/>
      <stop offset="1" stop-color="#ee5533"/>
    </linearGradient>
    <mask id="cmask">
      <circle cx="60" cy="64" r="38" fill="white"/>
      <!-- inner radius nhỏ hơn: 24 → 18 → dày hơn -->
      <circle cx="60" cy="64" r="20" fill="black"/>
      <rect x="65" y="26" width="50" height="20" fill="black"/>
      <rect x="67" y="82" width="50" height="20" fill="black"/>
    </mask>
  </defs>
  <circle cx="60" cy="64" r="38" fill="url(#forge)" mask="url(#cmask)"/>
  <circle cx="95" cy="30" r="13" fill="#73d9ee"/>
</svg>